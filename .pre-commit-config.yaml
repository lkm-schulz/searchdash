# `pre-commit install` installs both stages so the gitlint commit-msg hook
# (and its UC1 no-hard-wrap rule) actually runs on every commit.
default_install_hook_types: [pre-commit, commit-msg]
# Default every hook to the pre-commit stage so they don't re-run (as no-ops on
# the message file) during the commit-msg stage; gitlint opts into commit-msg below.
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: check-added-large-files
      - id: check-json
      - id: check-yaml
        args: [--allow-multiple-documents, --unsafe]
      - id: check-merge-conflict
  - repo: https://github.com/asottile/pyupgrade
    rev: v3.20.0
    hooks:
      - id: pyupgrade
        args: ["--py3-plus", "--py36-plus"]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.3
    hooks:
      - id: ruff-check
        args: [--fix, --show-fixes]
      - id: ruff-format
        args: [--diff]
  - repo: https://github.com/jorisroovers/gitlint
    rev: v0.19.1
    hooks:
      - id: gitlint
        name: gitlint
        language: python
        entry: gitlint
        args: [--staged, --msg-filename]
        stages: [commit-msg]
  - repo: https://github.com/DetachHead/basedpyright-pre-commit-mirror
    rev: 1.38.4
    hooks:
      - id: basedpyright
        # Check the configured `include` only (not example/ artifacts, which
        # import libs like torch that aren't deps), regardless of staged files.
        pass_filenames: false
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
